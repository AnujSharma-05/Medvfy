<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedVerify</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#18201c;--muted:#5d6a63;--line:#d5dcd7;--accent:#24607f;color-scheme:light;font-family:system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--card:#1a201d;--text:#e4eae6;--muted:#9aa7a0;--line:#34413a;--accent:#74aecf;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--text)}
main{max-width:620px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;color:var(--text);text-decoration:none}
a b{color:var(--accent);font-size:18px}
a span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>MedVerify</h1>
  <p>Running on this laptop. Choose a screen.</p>
  <a href="/patient"><b>Patient screen</b><span>Full-screen display next to the pill box: what to take, and a Stop sound button.</span></a>
  <a href="/care"><b>Caretaker app</b><span>Log in to watch doses, send reminders, edit the schedule. From a phone, use port 5050.</span></a>
  <a href="/console"><b>Developer console</b><span>Everything at once, for testing.</span></a>
</main>
</body>
</html>
